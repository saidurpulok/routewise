[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routewise"
version = "0.1.0"
description = "Learned LLM routing evaluated on real per-question benchmark results"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Saidur Rahman Pulok", email = "thisispulok77@gmail.com"}]
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4",
  "pyyaml>=6,<7",
]

[project.scripts]
routewise = "routewise.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
